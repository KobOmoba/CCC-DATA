<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>if (location.pathname === "/site") document.write('<base href="/site/">');</script>
<title>Find a parish · Celestial Church of Christ</title>
<meta name="description" content="Find a Celestial Church of Christ parish by name, city or country.">
<meta name="theme-color" content="#1e3a8a">
<link rel="stylesheet" href="site.css">
<script src="site.js" defer></script>
</head>
<body>
<main>
<h1>Find a parish</h1>
<input type="search" id="q" placeholder="Search by parish, city or country" aria-label="Search parishes">
<div id="results"><p class="empty">Loading…</p></div>
<p style="text-align:center"><button class="btn alt" id="more" hidden>Show more parishes</button></p>
<p class="muted">Only each parish's name, city, country, map link and service times are shown here.</p>
<script>
document.addEventListener("DOMContentLoaded", () => {
  let t; const q = document.getElementById("q");
  q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => findParishes(q.value), 300); });
  document.getElementById("more").addEventListener("click", () => findParishes("", true));
  findParishes("");
});
</script>
</main>
</body>
</html>
